[workspace]
resolver = "2"
members = [
    "crates/trelis-error",
    "crates/trelis-primitives",
    "crates/trelis-hybrid",
    "crates/trelis-wire",
    "crates/trelis-x3dh-pq",
    "crates/trelis-ratchet",
    "crates/trelis-cocoa",
    "crates/trelis-multidevice",
    "crates/trelis-integration-tests",
    "crates/trelis-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Dominic Pearson <dsp@technoanimal.net>"]
license = "ISC"
rust-version = "1.85"
repository = "https://github.com/dspearson/trelis"
description = "Hybrid post-quantum cryptographic library implementing the Trelis protocol"

[workspace.dependencies]
# Internal crates (default-features = false for flexible feature propagation)
trelis-error = { path = "crates/trelis-error", default-features = false }
trelis-primitives = { path = "crates/trelis-primitives", default-features = false }
trelis-hybrid = { path = "crates/trelis-hybrid", default-features = false }
trelis-wire = { path = "crates/trelis-wire", default-features = false }
trelis-x3dh-pq = { path = "crates/trelis-x3dh-pq", default-features = false }
trelis-ratchet = { path = "crates/trelis-ratchet", default-features = false }
trelis-cocoa = { path = "crates/trelis-cocoa", default-features = false }
trelis-multidevice = { path = "crates/trelis-multidevice", default-features = false }

# Cryptographic primitives
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
blake3 = { version = "1.5", default-features = false }
sha2 = { version = "0.10", default-features = false }  # SHA-512 for sntrup761 compatibility
ed448-goldilocks-plus = { version = "0.16", default-features = false, features = ["alloc", "signing", "zeroize", "pkcs8"] }
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65"] }
pqcrypto-ntruprime = "0.1"  # C FFI bindings, requires std (native builds)
pqcrypto-traits = "0.3"    # Traits for pqcrypto crates
ntrulp = { version = "0.2", default-features = false, features = ["ntrup761"] }  # Pure Rust (WASM builds)

# Security utilities
zeroize = { version = "1.8", default-features = false, features = ["derive", "alloc"] }
subtle = { version = "2.5", default-features = false }
rand_core = { version = "0.6", default-features = false }
getrandom = { version = "0.2", default-features = false }
libc = { version = "0.2", default-features = false }  # Memory locking (Unix mlock)
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_System_SystemInformation"] }  # Memory locking (Windows VirtualLock)

# WASM support
wasm-bindgen = { version = "0.2", default-features = false }

# Error handling (no_std compatible)
# thiserror requires std, so we use core::fmt::Display directly

# Development and testing
hex = "0.4"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"
serde = { version = "1.0", default-features = false }
serde_json = "1.0"

[workspace.lints.rust]
# NOTE: Using "deny" instead of "forbid" to allow unsafe in memlock.rs (mlock FFI)
# All other modules still forbid unsafe via #![forbid(unsafe_code)]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
