# cargo-deny policy for the Trelis workspace.
# https://embarkstudios.github.io/cargo-deny/
# Schema: cargo-deny 0.18.x (post-PR-611 format)

[advisories]
# Enforced in CI: `cargo deny check` runs in the Security Audit job,
# alongside `cargo audit --deny warnings`. Both gate the build.
#
# The ignore list is empty and should stay that way where possible:
# prefer upgrading past an advisory to exempting it. Any entry added
# here needs a reason and must be re-checked whenever the lockfile
# moves — stale exemptions silently mask real findings. The previous
# entries (RUSTSEC-2026-0012, RUSTSEC-2026-0097 and a keccak 0.1.5 yank)
# were all resolved by dependency upgrades rather than exemption.
ignore = []

[licenses]
# All observed dependency licences are OSI-approved permissive.
# Workspace licence is ISC. Add new licences here if the dependency tree changes.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    # Pruned 2026-05-15: "Unicode-DFS-2016", "OpenSSL", "Zlib" — no crate in
    # the current dep tree carries these licences.
]

# Known residual warning:
#
#   warning[no-license-field]: license expression was not specified in
#   manifest for crate 'ntrulp = 0.2.5'
#
# `ntrulp 0.2.5` ships an ISC `LICENSE` file (verified against the cached
# registry copy at ~/.cargo/registry/.../ntrulp-0.2.5/LICENSE) but its
# `Cargo.toml` uses `license-file = "LICENSE"` instead of the SPDX-compliant
# `license = "ISC"` field. cargo-deny emits a `no-license-field` warning for
# crates that lack the explicit field, even when the `LICENSE` file content
# is unambiguous. The warning is informational (it does not block the
# `licenses ok` summary) and is preserved as a TODO for upstream ntrulp:
# upstream-pin a PR to add `license = "ISC"` to ntrulp's manifest. The
# `[[licenses.clarify]]` mechanism could silence this locally but requires
# pinning a precise content hash, which couples our CI to upstream LICENSE
# file mtimes; the warning is left visible instead.
#
# `cargo deny check` exits 0; the `licenses` sub-check reports `ok`.

[bans]
# 9 duplicate version pairs exist — all are ecosystem-standard RC vs. stable
# splits (e.g., block-buffer 0.10/0.11, digest 0.10/0.11, sha3 0.10/0.11). They
# are not duplicate crypto implementations — they're driven by upstream crates
# moving to RC versions on independent schedules. Accepted; flip to "warn"
# or "deny" if a future audit wants to surface these again.
multiple-versions = "allow"
wildcards = "allow"

[sources]
# All dependencies must come from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
