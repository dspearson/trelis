# cargo-deny policy for the Trelis workspace
# Generated during Phase 1 supply-chain audit (2026-05-13)
# https://embarkstudios.github.io/cargo-deny/
# Schema: cargo-deny 0.18.x (post-PR-611 format)

[advisories]
# Deny known vulnerabilities (severity = vulnerability in advisory-db).
# Unsound and yanked advisories are documented in FINDINGS.md — Phase 1 is a
# baseline documentation run, not a CI gate.
ignore = [
    # RUSTSEC-2026-0012: Unsound ARMv8 asm backend in keccak 0.1.5.
    # Severity: Low (latent on x86-64 targets). Filed in FINDINGS.md.
    { id = "RUSTSEC-2026-0012", reason = "Unsound ARMv8 asm; latent on x86-64 — filed as Low in FINDINGS.md" },
    # RUSTSEC-2026-0097: rand unsound with custom logger.
    # Severity: Informational (requires custom logger; unlikely in this library).
    { id = "RUSTSEC-2026-0097", reason = "Requires custom logger to trigger; Informational in FINDINGS.md" },
    # keccak 0.1.5 yanked (superseded by 0.2.0-rc.0).
    # Severity: Low (ecosystem churn, not a security vulnerability).
    "keccak@0.1.5",
]

[licenses]
# All observed dependency licences are OSI-approved permissive.
# Workspace licence is ISC. Add new licences here if the dependency tree changes.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    # Pruned 2026-05-15 (SUPPLY-02-NEW1): "Unicode-DFS-2016", "OpenSSL", "Zlib"
    # — no crate in the current dep tree carries these licences.
]

exceptions = [
    # No ntrulp exception needed since 0.2.5 — the upstream `Cargo.toml` still
    # omits the `license` field (still reports "unknown" from cargo-deny), but
    # the warning is now a `no-license-field` rather than a missing-allowance,
    # so an explicit exception block matched zero crates and was pruned
    # (SUPPLY-02-NEW1). Tracked as an upstream-ntrulp issue.
]

[bans]
# 9 duplicate version pairs exist — all are ecosystem-standard RC vs. stable splits,
# not duplicate crypto implementations. Warn rather than deny.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# All dependencies must come from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
