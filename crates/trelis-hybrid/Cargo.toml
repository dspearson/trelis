[package]
name = "trelis-hybrid"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hybrid post-quantum cryptographic constructions for the Trelis protocol"

[features]
default = ["std"]
std = ["alloc", "trelis-primitives/std", "trelis-error/std"]
alloc = ["trelis-primitives/alloc", "trelis-error/alloc"]
# WASM target support (browser environment)
wasm = ["alloc", "trelis-primitives/wasm"]
# Expose internal functions for testing
expose-internals = []
# Enable ML-DSA-B-65 (BLAKE3 variant) for hybrid signatures
mldsa-blake3 = ["trelis-primitives/mldsa-blake3"]
# Use BLAKE3 as the default ML-DSA variant (requires mldsa-blake3)
mldsa-blake3-default = ["mldsa-blake3", "trelis-primitives/mldsa-blake3-default"]
# Enable memory locking and guard pages for secret key protection
mlock = ["trelis-primitives/mlock"]

[dependencies]
trelis-primitives.workspace = true
trelis-error.workspace = true
zeroize.workspace = true
subtle.workspace = true
blake3.workspace = true
fips204.workspace = true

[dev-dependencies]
hex.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "hybrid_benchmark"
harness = false
