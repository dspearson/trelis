[package]
name = "trelis-multidevice"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Multi-device support and history synchronisation for Trelis"

[features]
default = ["std", "alloc"]
std = ["alloc", "trelis-primitives/std", "trelis-hybrid/std"]
alloc = ["trelis-primitives/alloc", "trelis-hybrid/alloc"]
# WASM target support (browser environment)
wasm = ["alloc", "trelis-primitives/wasm", "trelis-hybrid/wasm"]
expose-internals = []

[dependencies]
trelis-error.workspace = true
trelis-primitives.workspace = true
trelis-hybrid.workspace = true
trelis-wire.workspace = true
zeroize.workspace = true
blake3.workspace = true
hex.workspace = true
rand_core.workspace = true

[dev-dependencies]

[lints]
workspace = true

# `trelis-wire` is a workspace-internal dep flagged unused by `cargo machete`
# but retained — workspace-internal `trelis-*` deps may be used for type
# re-export or feature unification that a textual scan misses, so the
# machete ignore is intentional. Same rationale as `trelis-cocoa`.
[package.metadata.cargo-machete]
ignored = ["trelis-wire"]
