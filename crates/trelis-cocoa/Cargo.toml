[package]
name = "trelis-cocoa"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "CoCoA-SA (Concurrent Continuous Group Key Agreement - Server Assisted) for Trelis"

[features]
default = ["std", "alloc"]
std = ["alloc", "trelis-primitives/std", "trelis-hybrid/std"]
alloc = ["trelis-primitives/alloc", "trelis-hybrid/alloc"]
# WASM target support (browser environment)
wasm = ["alloc", "trelis-primitives/wasm", "trelis-hybrid/wasm"]
expose-internals = []
# Exposes the raw epoch-secret accessors (EpochSecrets::epoch_secret /
# CocoaSession::current_epoch_secret) for client-side session serialisation.
# Enabled only by trelis-wasm (the sole consumer); off by default so the raw
# epoch secret is not on the default public surface (GAP-04b / F07 prong b).
session-serialization = []

[dependencies]
trelis-error.workspace = true
trelis-primitives.workspace = true
trelis-hybrid = { workspace = true, features = ["expose-internals"] }
trelis-wire.workspace = true
blake3.workspace = true
zeroize.workspace = true
subtle.workspace = true

[dev-dependencies]
hex.workspace = true
criterion.workspace = true

[[bench]]
name = "cocoa_benchmark"
harness = false

[lints]
workspace = true

# `trelis-wire` is a workspace-internal dep flagged unused by `cargo machete`
# but retained intentionally. Workspace-internal `trelis-*` deps may be used
# for type re-export or feature unification that a textual scan misses, so
# the machete ignore is deliberate.
[package.metadata.cargo-machete]
ignored = ["trelis-wire"]
