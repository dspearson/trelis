[package]
name = "trelis-cocoa"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "CoCoA-SA (Concurrent Continuous Group Key Agreement - Server Assisted) for Trelis"

[features]
default = ["std", "alloc"]
std = ["alloc", "trelis-primitives/std", "trelis-hybrid/std"]
alloc = ["trelis-primitives/alloc", "trelis-hybrid/alloc"]
# WASM target support (browser environment)
wasm = ["alloc", "trelis-primitives/wasm", "trelis-hybrid/wasm"]
expose-internals = []

[dependencies]
trelis-error.workspace = true
trelis-primitives.workspace = true
trelis-hybrid = { workspace = true, features = ["expose-internals"] }
trelis-wire.workspace = true
blake3.workspace = true
zeroize.workspace = true
subtle.workspace = true

[dev-dependencies]
hex.workspace = true
criterion.workspace = true

[[bench]]
name = "cocoa_benchmark"
harness = false

[lints]
workspace = true

# `trelis-wire` is a workspace-internal dep flagged unused by `cargo machete`
# but retained per T-10-10 (Phase 10 threat model). Workspace-internal `trelis-*`
# deps are NEVER removed by machete-driven changes in Phase 10 — they may be
# used for type re-export / feature unification that grep misses. Phase 13 may
# revisit under no time pressure.
[package.metadata.cargo-machete]
ignored = ["trelis-wire"]
