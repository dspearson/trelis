[package]
name = "trelis-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WASM bindings for Trelis cryptographic primitives and signatures"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Console error panic hook for better WASM debugging
console_error_panic_hook = ["dep:console_error_panic_hook"]
# ML-DSA BLAKE3 variant support
mldsa-blake3 = ["trelis-primitives/mldsa-blake3", "trelis-hybrid/mldsa-blake3"]
# Use BLAKE3 as default ML-DSA scheme
mldsa-blake3-default = ["mldsa-blake3", "trelis-primitives/mldsa-blake3-default", "trelis-hybrid/mldsa-blake3-default"]

[dependencies]
trelis-error = { workspace = true }
trelis-primitives = { workspace = true, features = ["wasm"] }
trelis-hybrid = { workspace = true, features = ["wasm"] }
trelis-x3dh-pq = { workspace = true, features = ["wasm"] }
trelis-ratchet = { workspace = true, features = ["wasm"] }
trelis-cocoa = { workspace = true, features = ["wasm"] }
trelis-multidevice = { workspace = true, features = ["wasm"] }
wasm-bindgen.workspace = true
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
