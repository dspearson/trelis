[package]
name = "trelis-primitives"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cryptographic primitives for the Trelis protocol"

[features]
default = ["std"]
# std feature: enables standard library support
# On Unix/Linux: uses C FFI sntrup761 (pqcrypto-ntruprime) for performance
# On Windows: uses pure Rust sntrup761 (ntrulp) since pqcrypto C code doesn't compile with MSVC
std = ["alloc", "trelis-error/std", "blake3/std", "blake3/rayon", "chacha20poly1305/std", "getrandom/std"]
alloc = ["trelis-error/alloc", "chacha20poly1305/alloc"]
# WASM target support (browser environment)
# Uses ntrulp (pure Rust) with custom encoding to match standard wire format
# Enables BLAKE3 WASM SIMD for faster hashing in browsers with SIMD support
wasm = ["alloc", "getrandom/js", "ntrulp", "blake3/wasm32_simd"]
# Expose internal functions for testing
expose-internals = []
# Memory locking to prevent secrets from being swapped to disk
# Provides LockedBox<T> and mlock/munlock functions
# Unix: mlock(2), Windows: VirtualLock
mlock = ["std", "libc", "windows-sys"]

# ML-DSA-65 BLAKE3 variant (faster, experimental)
# Provides MlDsa65B* types separate from standard MlDsa65* (FIPS 204)
mldsa-blake3 = []
# Use BLAKE3 as the default ML-DSA variant (requires mldsa-blake3)
mldsa-blake3-default = ["mldsa-blake3"]

# Ed448 BLAKE3 variant (faster, non-standard)
# Provides Ed448B* types separate from standard Ed448* (RFC 8032)
ed448-blake3 = []
# Use BLAKE3 as the default Ed448 variant (requires ed448-blake3)
ed448-blake3-default = ["ed448-blake3"]

[dependencies]
trelis-error.workspace = true
blake3.workspace = true
sha2.workspace = true
sha3 = { version = "0.11.0-rc.0", default-features = false }
chacha20poly1305.workspace = true
ed448-goldilocks-plus.workspace = true
fips204.workspace = true
zeroize.workspace = true
subtle.workspace = true
rand_core.workspace = true
getrandom.workspace = true
hybrid-array = { version = "0.4", features = ["extra-sizes", "zeroize"] }
num-traits = { version = "0.2.19", default-features = false }
signature = { version = "3.0.0-rc.2", default-features = false, features = ["rand_core"] }

# Post-quantum KEM - Pure Rust (WASM builds, with custom encoding layer)
ntrulp = { workspace = true, optional = true }
# Memory locking (optional, for mlock feature)
libc = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true }

# Post-quantum KEM - C FFI (native Unix/Linux only)
# Excluded on Windows (MSVC issues) and WASM (no C FFI)
[target.'cfg(all(not(target_os = "windows"), not(target_arch = "wasm32")))'.dependencies]
pqcrypto-ntruprime = { workspace = true }
pqcrypto-traits = { workspace = true }

# On Windows and WASM, use pure Rust sntrup761 instead of C FFI
[target.'cfg(any(target_os = "windows", target_arch = "wasm32"))'.dependencies]
ntrulp = { workspace = true }

[dev-dependencies]
hex = { workspace = true, features = ["serde"] }
hex-literal = "1.1"
proptest.workspace = true
criterion.workspace = true
rayon.workspace = true
rand = "0.8"
serde.workspace = true
serde_json.workspace = true

[[bench]]
name = "sntrup761_benchmark"
harness = false
required-features = ["std", "wasm"]

[[bench]]
name = "signature_benchmark"
harness = false

[[bench]]
name = "mldsa_variant_benchmark"
harness = false

[[bench]]
name = "ed448_variant_benchmark"
harness = false
