[package]
name = "trelis-primitives"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cryptographic primitives for the Trelis protocol"

[features]
default = ["std"]
# std feature: enables standard library support
# sntrup761 is pure Rust (ntrulp) on every target — no C toolchain required
std =["alloc", "trelis-error/std", "blake3/std", "blake3/rayon", "chacha20poly1305/std", "getrandom/std"]
alloc = ["trelis-error/alloc", "chacha20poly1305/alloc"]
# WASM target support (browser environment)
# Enables BLAKE3 WASM SIMD for faster hashing in browsers with SIMD support
# `getrandom_v04/wasm_js` activates the wasm_js backend on the transitive
# getrandom 0.4.x pulled in via ntrulp 0.2.5 -> rand 0.10.1. Without this,
# wasm32-unknown-unknown trips a `compile_error!` in getrandom 0.4.2/backends.rs.
wasm = ["alloc", "getrandom/js", "getrandom_v04/wasm_js", "dep:getrandom_v04", "blake3/wasm32_simd"]
# Expose internal functions for testing
expose-internals = []
# Memory locking to prevent secrets from being swapped to disk
# Provides LockedBox<T> and mlock/munlock functions
# Unix: mlock(2), Windows: VirtualLock
mlock = ["std", "libc", "windows-sys"]

# ML-DSA-65 BLAKE3 variant (faster, experimental)
# Provides MlDsa65B* types separate from standard MlDsa65* (FIPS 204)
mldsa-blake3 = []
# Use BLAKE3 as the default ML-DSA variant (requires mldsa-blake3)
mldsa-blake3-default = ["mldsa-blake3"]

# Ed448 BLAKE3 variant (faster, non-standard)
# Provides Ed448B* types separate from standard Ed448* (RFC 8032)
ed448-blake3 = []
# Use BLAKE3 as the default Ed448 variant (requires ed448-blake3)
ed448-blake3-default = ["ed448-blake3"]

[dependencies]
trelis-error.workspace = true
blake3.workspace = true
sha2.workspace = true
sha3 = { version = "0.11.0-rc.0", default-features = false }
chacha20poly1305.workspace = true
ed448-goldilocks-plus.workspace = true
fips204.workspace = true
zeroize.workspace = true
subtle.workspace = true
rand_core.workspace = true
rand_core_v10.workspace = true
getrandom.workspace = true
# Optional — activated only by the `wasm` feature; see [features].wasm above.
getrandom_v04 = { workspace = true, optional = true }
hybrid-array = { version = "0.4", features = ["extra-sizes", "zeroize"] }
num-traits = { version = "0.2.19", default-features = false }
signature = { version = "3.0.0", default-features = false, features = ["rand_core"] }

# Post-quantum KEM - Pure Rust (always included for deterministic keygen)
ntrulp = { workspace = true }
# Memory locking (optional, for mlock feature)
libc = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true, features = ["serde"] }
hex-literal = "1.1"
proptest.workspace = true
criterion.workspace = true
rayon.workspace = true
rand = "0.8"
serde.workspace = true
serde_json.workspace = true

[[bench]]
name = "sntrup761_benchmark"
harness = false
required-features = ["std"]

[[bench]]
name = "signature_benchmark"
harness = false

[[bench]]
name = "mldsa_variant_benchmark"
harness = false

[[bench]]
name = "ed448_variant_benchmark"
harness = false

# Inherit the workspace lint policy (unsafe_code = "deny", clippy unwrap/expect/panic
# at warn level). The two unsafe blocks in `mldsa_core/module_lattice/util.rs` and
# memlock FFI carry file-level `#![allow(unsafe_code)]` with justification.
[lints]
workspace = true

# `getrandom_v04` is optional and activated only by the `wasm` feature via the
# `dep:getrandom_v04` syntax (see [features].wasm above). The dep is not used
# directly in source; it exists to activate the `wasm_js` backend on the
# transitive getrandom 0.4.x crate pulled in by ntrulp 0.2.5 -> rand 0.10.1.
# Without it, wasm32-unknown-unknown trips a compile_error in getrandom's
# backends.rs.
[package.metadata.cargo-machete]
ignored = ["getrandom_v04"]
